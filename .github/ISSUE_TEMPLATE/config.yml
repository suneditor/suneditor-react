blank_issues_enabled: false
contact_links:
    - name: Editor engine bug (options, plugins, content, rendering)
      url: https://github.com/JiHong88/SunEditor/issues/new/choose
      about: Bugs in SunEditor itself belong to the engine repository. This repository only covers the React wrapper.
    - name: Question / usage help
      url: https://github.com/JiHong88/SunEditor/discussions/categories/q-a
      about: Ask how to configure or integrate SunEditor in Discussions Q&A.
    - name: Report a security vulnerability
      url: https://github.com/suneditor/react/security/advisories/new
      about: Report vulnerabilities privately. Do not open a public issue.
