name: Bug report
description: The React wrapper does not behave as expected
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              > [!IMPORTANT]
              > **This repository only covers the React wrapper.** It is a thin layer that passes options through to the
              > [SunEditor](https://github.com/JiHong88/SunEditor) engine and does not change editor behavior.
              >
              > Editor bugs (toolbar, plugins, options, content, formatting, rendering) filed here **will not be fixed here**.
              > They will be closed and you will be asked to file them again in the
              > [engine repository](https://github.com/JiHong88/SunEditor/issues/new/choose).
              >
              > Quick check: does the same problem happen with plain `suneditor.create()` outside React? If yes, it is an engine bug.
    - type: checkboxes
      id: scope
      attributes:
          label: Scope
          options:
              - label: I checked that this does **not** happen with plain `suneditor.create()`. It only happens through the React wrapper (props, `ref`, lifecycle, SSR / Next.js).
                required: true
    - type: input
      id: versions
      attributes:
          label: Versions
          description: '`@suneditor/suneditor-react`, `suneditor`, `react`, and the framework (Next.js, Vite, ...) if any'
          placeholder: '@suneditor/suneditor-react 1.0.0, suneditor 3.4.1, react 19.1, next 15.5'
      validations:
          required: true
    - type: dropdown
      id: rendering
      attributes:
          label: Rendering
          options:
              - Client only (Vite, CRA, ...)
              - Next.js App Router
              - Next.js Pages Router
              - Other SSR framework
      validations:
          required: true
    - type: textarea
      id: repro
      attributes:
          label: Reproduction
          description: Minimal component code, or a link to a repository / StackBlitz.
          render: tsx
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: Include console errors and warnings.
      validations:
          required: true
