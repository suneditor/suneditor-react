name: Feature request
description: Suggest a change to the React wrapper
labels: ['enhancement']
body:
    - type: markdown
      attributes:
          value: |
              The wrapper intentionally keeps a small API and passes engine options through as-is.
              Requests for new editor features (buttons, plugins, options) belong to the
              [engine repository](https://github.com/JiHong88/SunEditor/issues/new/choose).
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What can you not do with the current props and `ref`?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed API
          render: tsx
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: For example `ref.current.resetOptions()`, `options.events`, or remounting with `key`.
